name: Deploy Locally

on:
  push:
    branches: [Production]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart API
        working-directory: apps/api
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -p traffic-dashboard-backend down
          docker compose -p traffic-dashboard-backend up --build -d

      - name: Rebuild and restart web
        working-directory: apps/web
        run: |
          docker compose -p traffic-dashboard-frontend down
          docker compose -p traffic-dashboard-frontend up --build -d

      - name: Verify API is responding
        run: |
          $ErrorActionPreference = "Stop"
          for ($i = 1; $i -le 10; $i++) {
            try {
              Invoke-RestMethod -Uri "http://localhost:4000/traffic/by-country" -TimeoutSec 5 | Out-Null
              Write-Host "API responded on attempt $i"
              exit 0
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 3
            }
          }
          Write-Error "API did not respond after 10 attempts"
          exit 1
