name: Deploy Locally

on:
  push:
    branches: [Production]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write API .env
        working-directory: apps/api
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: printf '%s\n' "$API_ENV_FILE" > .env

      - name: Rebuild and restart API
        working-directory: apps/api
        run: |
          docker compose -p traffic-dashboard-backend down
          docker compose -p traffic-dashboard-backend up --build -d

      - name: Rebuild and restart web
        working-directory: apps/web
        run: |
          docker compose -p traffic-dashboard-frontend down
          docker compose -p traffic-dashboard-frontend up --build -d

      - name: Verify API is responding
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:4000/traffic/by-country && break
            sleep 3
          done
